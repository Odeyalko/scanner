<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Сканер</title>
    <style>
        body {
            margin: 0;
            background: black;
            font-family: 'Roboto', sans-serif;
        }

        #scannerContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #video {
            width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #statusMessage {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }

        #closeButton {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 12px 24px;
            background: #FF5722;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #closeButton:hover {
            background: #E64A19;
        }

        @media (max-width: 600px) {
            #scanArea {
                width: 300px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="scannerContainer">
        <video id="video" autoplay playsinline></video>
        <div id="scanArea"></div>
        <div id="statusMessage">Наведите камеру на QR-код</div>
        <button id="closeButton" onclick="closeScanner()">Закрыть</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
    const codeReader = new ZXing.BrowserQRCodeReader();
    const video = document.getElementById("video");
    const statusMessage = document.getElementById("statusMessage");

    // Запуск камеры
    codeReader.decodeFromVideoDevice(null, video)
        .then(result => {
            statusMessage.textContent = "QR-код найден!";
            window.location.href = `index.html#${result.text}`;
        })
        .catch(err => {
            statusMessage.textContent = "Ошибка камеры. Проверьте разрешения.";
            console.error("Ошибка сканирования:", err);
        });

    function closeScanner() {
        window.history.back();
    }

    // Кнопка Esc для закрытия сканера
    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") closeScanner();
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            font-family: 'Roboto', sans-serif;
        }

        #scannerContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1001;
        }

        #statusMessage {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }

        #closeButton {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 8px 16px;
            background: #FF5722;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #scanArea {
                width: 300px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="scannerContainer">
        <video id="video" autoplay playsinline></video>
        <div id="scanArea"></div>
        <div id="statusMessage">Наведите камеру на QR-код</div>
        <button id="closeButton" onclick="closeScanner()">Закрыть</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/build/quagga.min.js"></script>
<script>
    const video = document.getElementById("video");
    let scanning = false;

    // Инициализация камеры
    navigator.mediaDevices.getUserMedia({ 
        video: { 
            facingMode: "environment",
            aspectRatio: 1.333,
            height: 480 
        } 
    })
    .then(stream => {
        video.srcObject = stream;
        video.play();
        startScanning();
    })
    .catch(err => {
        document.getElementById("statusMessage").textContent = "Ошибка доступа к камере";
        console.error("Ошибка:", err);
    });

    function startScanning() {
        if (scanning) return;
        scanning = true;
        const codeReader = new ZXing.BrowserQRCodeReader();

        (function scan() {
            if (!scanning) return;
            codeReader.decodeFromVideoDevice(null, video, (err, result) => {
                if (result) {
                    scanning = false;
                    window.location.href = `index.html#${result.text}`;
                } else {
                    requestAnimationFrame(scan);
                }
            });
        })();
    }

    function closeScanner() {
        window.location.href = "index.html";
    }
</script>
</body>
</html>

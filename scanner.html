<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Баркод Сканер</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        #scannerContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
            pointer-events: none;
            z-index: 1001;
        }

        #statusMessage {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
            z-index: 1001;
        }

        @media (max-width: 600px) {
            #scanArea {
                width: 300px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="scannerContainer">
        <video id="video" autoplay playsinline></video>
        <div id="scanArea"></div>
        <div id="statusMessage">Наведите камеру на код</div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
    const video = document.getElementById("video");
    const scanArea = document.getElementById("scanArea");
    const statusMessage = document.getElementById("statusMessage");

    // Используем BrowserMultiFormatReader для всех форматов
    const codeReader = new ZXing.BrowserMultiFormatReader();

    // Запуск сканера
    codeReader.decodeFromVideoDevice(null, video, (result, err) => {
        if (result) {
            statusMessage.textContent = "Код найден!";
            window.location.href = `index.html#${result.text}`;
        } else if (err && !err?.toString().includes("No video input")) {
            statusMessage.textContent = "Ошибка сканирования. Попробуйте ещё раз.";
            console.error("Ошибка сканирования:", err);
        }
    });

    // Автоматический возврат при Esc
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.history.back();
    });
</script>
</body>
</html>

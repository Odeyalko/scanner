<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR & Barcode Scanner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        #scannerContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1001;
        }

        #statusMessage {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <div id="scannerContainer">
        <video id="video" autoplay playsinline></video>
        <div id="scanArea"></div>
        <div id="statusMessage">Наведите камеру на код</div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.4/html5-qrcode.min.js"></script>
<script>
    const video = document.getElementById("video");
    const scanArea = document.getElementById("scanArea");
    const statusMessage = document.getElementById("statusMessage");

    // Инициализация камеры
    const html5QrcodeScanner = new Html5Qrcode("video", { verbose: false });

    const config = {
        fps: 10,
        qrbox: { width: 300, height: 200 }
    };

    // Запуск сканера
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
            video.srcObject = stream;
            video.play();
            startScanning();
        })
        .catch(err => {
            statusMessage.textContent = "Ошибка камеры. Проверьте разрешения.";
            console.error("Ошибка доступа к камере:", err);
            setTimeout(() => window.location.href = "index.html", 3000);
        });

    function startScanning() {
        html5QrcodeScanner.start(
            { facingMode: "environment" },
            config,
            (result) => {
                statusMessage.textContent = "Код найден!";
                window.opener.postMessage({ type: "SCAN_RESULT", data: result.text }, "*");
                setTimeout(() => window.close(), 1000); // Закрываем сканер через 1 секунду
            },
            (error) => {
                if (!error?.toString().includes("No code found")) {
                    statusMessage.textContent = "Ошибка сканирования. Попробуйте ещё раз.";
                    console.error("Ошибка сканирования:", error);
                }
            }
        );
    }
</script>
</body>
</html>

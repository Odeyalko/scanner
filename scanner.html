<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #212121;
            font-family: 'Roboto', sans-serif;
        }

        #scannerContainer {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 24px;
        }

        #video {
            width: 100%;
            height: auto;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 200px;
            transform: translate(-50%, -50%);
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
            pointer-events: none;
        }

        #statusMessage {
            color: white;
            font-size: 18px;
            text-align: center;
            margin-top: 24px;
        }

        #closeButton {
            position: absolute;
            top: 24px;
            right: 24px;
            padding: 8px 16px;
            background: #FF5722;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #scanArea {
                width: 250px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div id="scannerContainer">
        <video id="video" autoplay playsinline></video>
        <div id="scanArea"></div>
        <div id="statusMessage">Ожидание QR-кода...</div>
        <button id="closeButton" onclick="closeScanner()">Закрыть</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/build/quagga.min.js"></script>
<script>
    Quagga.init({
        inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector('#scannerContainer'),
            constraints: {
                facingMode: "environment",
                aspectRatio: 1.333,
                height: 480
            }
        },
        decoder: {
            readers: [ // Поддержка всех форматов
                "code_128_reader",
                "ean_reader",
                "ean_8_reader",
                "code_39_reader",
                "code_39_vin_reader",
                "codabar_reader",
                "upc_reader",
                "upc_e_reader",
                "i2of5_reader",
                "qr_code_reader"
            ]
        }
    }, (err) => {
        if (err) {
            document.getElementById('statusMessage').textContent = 'Ошибка доступа к камере';
            return;
        }
        Quagga.start();
    });

    Quagga.onDetected((result) => {
        const code = result.codeResult.code;
        Quagga.stop();
        window.location.href = `index.html#${code}`;
    });

    function closeScanner() {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>

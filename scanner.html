<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Баркод Сканер</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: fixed;
            top: 0;
            left: 0;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
        }

        #footer {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <div id="scanArea"></div>
    <div id="footer">by Odeyalko</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true }); // Убираем предупреждение
    let scanning = true;

    // Инициализация ZXing.js для всех форматов
    const codeReader = new ZXing.BrowserMultiFormatReader();

    // Запуск камеры
    navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: "environment",
            width: { ideal: 640 },
            height: { ideal: 480 }
        }
    })
    .then(stream => {
        video.srcObject = stream;
        video.play();

        // Ждем загрузки видео
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            startScanning();
        });
    })
    .catch(err => {
        console.error("Ошибка доступа к камере:", err);
        scanning = false;
    });

    // Функция сканирования
    function startScanning() {
        if (!scanning) return;
        requestAnimationFrame(startScanning);

        // Убедимся, что видео загружено
        if (video.readyState >= video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            // Читаем все форматы баркодов через ZXing.js
            const code = codeReader.decode(imageData.data, canvas.width, canvas.height);

            if (code) {
                scanning = false;
                window.opener.postMessage({ type: 'SCAN_RESULT', data: code.text }, '*');
                window.close();
            }
        }
    }

    // Закрытие сканера при Esc
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            scanning = false;
            window.close();
        }
    });
</script>
</body>
</html>

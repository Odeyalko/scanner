<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Баркод Сканер</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
        }

        #footer {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="scanArea"></div>
    <div id="footer">by Odeyalko</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@latest/dist/html5-qrcode.min.js"></script>
<script>
    const video = document.getElementById('video');
    const footer = document.getElementById('footer');

    // Инициализация сканера
    const scanner = new html5_qrcode.default();

    // Настройки сканера
    const config = {
        fps: 10,
        qrbox: { width: 300, height: 200 }
    };

    // Функция обработки результатов
    function onScanSuccess(decodedText) {
        window.opener.postMessage({ type: 'SCAN_RESULT', data: decodedText }, '*');
        window.close();
    }

    // Запуск сканера
    scanner.start(
        { facingMode: "environment" }, // Используем заднюю камеру
        config,
        onScanSuccess,
        document.getElementById('video')
    ).catch(err => {
        console.error("Ошибка доступа к камере:", err);
        footer.textContent = "Ошибка доступа к камере";
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR & Barcode Scanner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: fixed;
            top: 0;
            left: 0;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
        }

        #footer {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="scanArea"></div>
    <div id="footer">by Odeyalko</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.4/dist/html5-qrcode.min.js"></script>
<script>
    // Инициализация сканера
    window.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('video');
        const footer = document.getElementById('footer');

        // Используем правильное имя объекта
        const html5QrcodeScanner = new html5Qrcode("video");

        // Настройки сканера
        const config = {
            fps: 10,
            qrbox: { width: 300, height: 200 }
        };

        // Запуск сканера
        html5QrcodeScanner.start(
            { facingMode: "environment" }, // задняя камера
            config,
            (decodedText) => {
                // Передача данных в opener
                window.opener.postMessage({ type: 'SCAN_RESULT', data: decodedText }, '*');
                window.close();
            },
            (error) => {
                console.error("Ошибка сканирования:", error);
                footer.textContent = "Ошибка доступа к камере";
            }
        );
    });
</script>
</body>
</html>

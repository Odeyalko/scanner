<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            font-family: 'Roboto', sans-serif;
        }

        #scannerContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
            z-index: 999;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1001;
        }

        #statusMessage {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }

        #closeButton {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 12px 24px;
            background: #FF5722;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #fabScan {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #2196F3;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1002;
        }

        @media (max-width: 600px) {
            #scanArea {
                width: 300px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="scannerContainer">
        <video id="video" autoplay playsinline></video>
        <div id="scanArea"></div>
        <div id="statusMessage">Наведите камеру на QR-код</div>
        <button id="closeButton" onclick="closeScanner()">Закрыть</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/build/quagga.min.js"></script>
    <script>
        const video = document.getElementById("video");
        const scanArea = document.getElementById("scanArea");
        const statusMessage = document.getElementById("statusMessage");
        let scanning = false;

        // Инициализация камеры
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                startScanning();
            })
            .catch(err => {
                statusMessage.textContent = "Ошибка доступа к камере";
                console.error("Ошибка доступа к камере:", err);
            });

        function startScanning() {
            if (scanning) return;
            scanning = true;

            const codeReader = new ZXing.BrowserQRCodeReader();
            const track = video.srcObject.getTracks()[0];

            (function scan() {
                if (!scanning) return;
                codeReader.decodeFromVideoDevice(track.getSettings().deviceId, video)
                    .then(result => {
                        scanning = false;
                        track.stop();
                        window.location.href = `index.html#${result.text}`;
                    })
                    .catch(() => requestAnimationFrame(scan));
            })();
        }

        function closeScanner() {
            window.history.back();
        }
    </script>
</body>
</html>

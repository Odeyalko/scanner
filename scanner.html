<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Баркод Сканер</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <div id="scanArea"></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.4/dist/html5-qrcode.min.js"></script>
<script>
    const video = document.getElementById('video');
    let scanner;

    // Инициализация сканера
    window.addEventListener('DOMContentLoaded', () => {
        scanner = new html5_qrcode.default();
        
        // Настройки сканера
        const config = {
            fps: 10,
            qrbox: { width: 300, height: 200 }
        };

        // Запуск сканера
        scanner.start(
            { facingMode: "environment" }, // задняя камера
            config,
            (decodedText) => {
                window.opener.postMessage({ type: 'SCAN_RESULT', data: decodedText }, '*');
                window.close();
            },
            (error) => {
                console.error("Ошибка сканирования:", error);
            }
        );
    });
</script>
</body>
</html>

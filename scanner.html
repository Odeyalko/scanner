<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR & Barcode Scanner</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1001;
        }

        #statusMessage {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-align: center;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="scanArea"></div>
    <div id="statusMessage">Наведите камеру на код</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
    const video = document.getElementById("video");
    const statusMessage = document.getElementById("statusMessage");

    // Запуск камеры
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
            video.srcObject = stream;
            video.play();
            startScanning();
        })
        .catch(err => {
            statusMessage.textContent = "Ошибка камеры. Проверьте разрешения.";
            console.error("Ошибка доступа к камере:", err);
        });

    function startScanning() {
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const track = video.srcObject.getTracks()[0];

        (function scan() {
            if (!track.enabled) return;
            codeReader.decodeFromVideoDevice(track.getSettings().deviceId, video)
                .then(result => {
                    // Отправляем данные через postMessage
                    if (window.opener) {
                        window.opener.postMessage({ type: "SCAN_RESULT", data: result.text }, "*");
                    } else if (window.parent) {
                        window.parent.postMessage({ type: "SCAN_RESULT", data: result.text }, "*");
                    }
                    window.close(); // Закрываем окно сканера
                })
                .catch(() => requestAnimationFrame(scan));
        })();
    }
</script>
</body>
</html>

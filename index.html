<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: #f5f5f5;
        }

        .container {
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        #inputContainer {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #editUrl {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f8f8;
        }

        #btnLoadUrl {
            padding: 12px 24px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        #btnLoadUrl:hover {
            background: #1976D2;
        }

        #fabScan {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #2196F3;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            animation: bounce 1s infinite;
            z-index: 1001; /* Кнопка должна быть поверх всего */
        }

        #fabScan:hover {
            background: #1976D2;
        }

        #webViewContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000;
        }

        #webView {
            width: 100%;
            height: 100%;
            border: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 600px) {
            #fabScan {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="inputContainer">
            <input 
                type="text" 
                id="editUrl" 
                placeholder="Введите URL сайта">
            <button 
                id="btnLoadUrl" 
                onclick="loadUrl()">
                Перейти на сайт
            </button>
        </div>
    </div>

    <button 
        id="fabScan" 
        onclick="startScan()"
        style="position: fixed; bottom: 24px; right: 24px;">
        📸
    </button>

    <div id="webViewContainer">
        <iframe 
            id="webView" 
            onload="onPageLoaded()">
        </iframe>
        <button 
            onclick="closeWebView()" 
            style="position: absolute; top: 16px; right: 16px; 
            padding: 12px; background: #FF5722; color: white; 
            border: none; border-radius: 8px; cursor: pointer;">
            Закрыть
        </button>
    </div>

<script>
    const editUrl = document.getElementById('editUrl');
    const webView = document.getElementById('webView');
    const webViewContainer = document.getElementById('webViewContainer');
    const fabScan = document.getElementById('fabScan');

    function loadUrl() {
        const url = editUrl.value.trim();
        if (url) {
            webView.src = url;
            webViewContainer.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            editUrl.value = '';
        }
    }

    function closeWebView() {
        webViewContainer.style.display = 'none';
        document.body.style.overflow = 'auto';
        // Восстановить видимость кнопки сканирования
        fabScan.style.display = 'block';
    }

    function onPageLoaded() {
        // Убедитесь, что кнопка сканирования видима
        fabScan.style.display = 'block';
        // Открытие в полноэкранном режиме
        if (document.fullscreenEnabled) {
            webViewContainer.requestFullscreen();
        }
    }

    // Обработка данных от сканера
    if (window.location.hash) {
        const data = window.location.hash.slice(1);
        const input = document.activeElement;
        if (input && input.tagName === 'INPUT') {
            input.value = data;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
            window.location.hash = '';
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Добавлен мета-тег для поддержки PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        /* Добавлены стили для статусной строки */
        #statusBar {
            padding: 12px;
            background: #333;
            color: white;
            display: none;
        }
    </style>
</head>
<body>
    <div id="statusBar"></div>
    <!-- Остальная разметка без изменений -->

    <script>
        // Обновлённый обработчик сообщений
        window.addEventListener("message", (event) => {
            if (event.data?.type === "SCAN_RESULT") {
                showStatus("Данные получены...", "success");
                const data = event.data.data;
                
                // Попытка автоматического заполнения
                const inputs = document.querySelectorAll('input, textarea');
                const activeInput = [...inputs].find(e => e === document.activeElement);
                
                const target = activeInput || inputs[0];
                if (target) {
                    target.focus();
                    target.value = data;
                    // Имитация пользовательского ввода
                    const inputEvent = new Event('input', { bubbles: true });
                    target.dispatchEvent(inputEvent);
                } else {
                    showStatus("Не найдено поле для ввода", "error");
                }
            }
        });

        // Новая функция для отображения статуса
        function showStatus(message, type = "info") {
            const statusBar = document.getElementById("statusBar");
            statusBar.style.display = "block";
            statusBar.textContent = message;
            statusBar.className = type;
            setTimeout(() => statusBar.style.display = "none", 2000);
        }
    </script>
</body>
</html>

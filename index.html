<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR & Barcode Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: #f5f5f5;
        }

        .container {
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        #inputContainer {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #editUrl {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f8f8;
        }

        #btnLoadUrl {
            padding: 12px 24px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        #btnLoadUrl:hover {
            background: #1976D2;
        }

        #fabScan {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #2196F3;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            animation: bounce 1s infinite;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #webView {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
        }

        @media (max-width: 600px) {
            #fabScan {
                width: 64px;
                height: 64px;
                bottom: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="inputContainer">
            <input type="text" id="editUrl" placeholder="Введите URL сайта" />
            <button id="btnLoadUrl" onclick="loadUrl()">Перейти на сайт</button>
        </div>

        <iframe id="webView" onload="onPageLoaded()"></iframe>
    </div>

    <button id="fabScan" onclick="startScan()">📸</button>

<script>
    const webView = document.getElementById("webView");
    const fabScan = document.getElementById("fabScan");

    function loadUrl() {
        const url = document.getElementById("editUrl").value.trim();
        if (url) {
            webView.src = url;
            webView.style.display = "block";
            document.getElementById("inputContainer").style.display = "none";
        }
    }

    function startScan() {
        window.location.href = "scanner.html";
    }

    function onPageLoaded() {
        fabScan.style.display = "flex";
    }

    // Обработка данных от сканера
    if (window.location.hash) {
        const data = window.location.hash.slice(1);
        const input = document.activeElement;
        if (input && input.tagName === "INPUT") {
            input.value = data;
            input.dispatchEvent(new Event("input", { bubbles: true }));
            input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
            window.location.hash = "";
        }
    }
</script>
</body>
</html>

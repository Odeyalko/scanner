<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR & Barcode Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: #f5f5f5;
        }

        .container {
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        #inputContainer {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #editUrl {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f8f8;
        }

        #btnLoadUrl {
            padding: 12px 24px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
        }

        #webView {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
        }

        #fabScan {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #2196F3;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1001;
            animation: bounce 1s infinite;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #scannerContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
            z-index: 1001;
            pointer-events: none;
        }

        #footer {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
            z-index: 1001;
        }

        #closeScanner {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 12px 24px;
            background: #FF5722;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1001;
        }

        #closeScanner:hover {
            background: #E64A19;
        }

        #scannerInput {
            display: none;
            position: fixed;
            bottom: 16px;
            left: 16px;
            width: 100px;
            height: 40px;
            border: none;
            border-radius: 8px;
            padding: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Форма ввода URL -->
    <div id="inputContainer" class="container">
        <input type="text" id="editUrl" placeholder="Введите URL сайта">
        <button id="btnLoadUrl">Перейти на сайт</button>
    </div>

    <!-- iframe для сайта -->
    <iframe id="webView" style="border: none;"></iframe>

    <!-- Кнопка сканирования -->
    <button id="fabScan">📸</button>

    <!-- Сканер -->
    <div id="scannerContainer">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display: none;"></canvas>
        <div id="scanArea"></div>
        <button id="closeScanner">Закрыть</button>
        <input type="text" id="scannerInput" placeholder="Результат сканирования">
    </div>

    <div id="footer">by Odeyalko</div>

<script>
    const editUrl = document.getElementById("editUrl");
    const webView = document.getElementById("webView");
    const fabScan = document.getElementById("fabScan");
    const scannerContainer = document.getElementById("scannerContainer");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const scannerInput = document.getElementById("scannerInput");
    const closeScannerBtn = document.getElementById("closeScanner");
    let scanning = false;
    let currentInput = null;

    // Загрузка сайта
    document.getElementById("btnLoadUrl").addEventListener("click", () => {
        const url = editUrl.value.trim();
        if (url) {
            webView.src = url;
            webView.style.display = "block";
            inputContainer.style.display = "none";
            scannerInput.style.display = "none";
        }
    });

    // Загрузка iframe
    webView.addEventListener("load", () => {
        fabScan.style.display = "flex";
        try {
            const iframeDoc = webView.contentDocument || webView.contentWindow.document;
            const inputs = iframeDoc.querySelectorAll("input");
            if (inputs.length > 0) {
                currentInput = inputs[0];
                currentInput.removeAttribute("autofocus");
            }
        } catch (e) {
            console.warn("Невозможно получить доступ к iframe — cross-origin ограничение");
            scannerInput.style.display = "block";
            currentInput = scannerInput;
        }
    });

    // Открытие сканера
    fabScan.addEventListener("click", () => {
        if (!webView.src) {
            alert("Сначала введите URL сайта");
            return;
        }
        scannerContainer.style.display = "block";
        fabScan.style.display = "none";
        webView.style.display = "none";
        startScanner();
    });

    // Закрытие сканера
    closeScannerBtn.addEventListener("click", () => {
        stopScanner();
        scannerContainer.style.display = "none";
        webView.style.display = "block";
        fabScan.style.display = "flex";
        scannerInput.style.display = "none";
        if (currentInput && currentInput !== scannerInput) {
            currentInput.focus();
        }
    });

    // Сканер (jsQR)
    function startScanner() {
        if (scanning) return;
        scanning = true;

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } 
        })
        .then(stream => {
            video.srcObject = stream;
            video.play();
            video.addEventListener("loadeddata", () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                requestAnimationFrame(scanLoop);
            });
        })
        .catch(err => {
            alert("Ошибка камеры. Проверьте разрешения.");
            console.error("Ошибка доступа к камере:", err);
            stopScanner();
        });

        function scanLoop() {
            if (!scanning) return;
            if (video.readyState >= video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    if (currentInput === scannerInput) {
                        scannerInput.value = code.data;
                        scannerInput.dispatchEvent(new Event("input", { bubbles: true }));
                    } else if (currentInput) {
                        currentInput.value = code.data;
                        currentInput.dispatchEvent(new Event("input", { bubbles: true }));
                        currentInput.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
                    }
                    stopScanner();
                    closeScannerBtn.click(); // Автоматическое закрытие
                }
            }
            requestAnimationFrame(scanLoop);
        }

        function stopScanner() {
            scanning = false;
            const stream = video.srcObject;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }
    }
</script>

<!-- Поддержка QR и штрихкодов -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</body>
</html>

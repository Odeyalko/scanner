<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR & Barcode Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: #f5f5f5;
        }

        .container {
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        #inputContainer {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #editUrl {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f8f8;
        }

        #btnLoadUrl {
            padding: 12px 24px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
        }

        #webView {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
        }

        #fabScan {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #2196F3;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1001;
            animation: bounce 1s infinite;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 600px) {
            #fabScan {
                width: 64px;
                height: 64px;
                bottom: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="inputContainer">
            <input type="text" id="editUrl" placeholder="Введите URL сайта">
            <button id="btnLoadUrl" onclick="loadUrl()">Перейти на сайт</button>
        </div>

        <iframe 
            id="webView" 
            style="border: none;"
            onload="handleWebViewLoad()"></iframe>
    </div>

    <button id="fabScan" onclick="startScan()">📸</button>

<script>
    const webView = document.getElementById("webView");
    const fabScan = document.getElementById("fabScan");
    let currentInput = null;

    function loadUrl() {
        const url = document.getElementById("editUrl").value.trim();
        if (url) {
            webView.src = url;
            webView.style.display = "block";
            document.getElementById("inputContainer").style.display = "none";
            currentInput = null;
        }
    }

    function startScan() {
        window.open("scanner.html", "ScannerWindow", "width=600,height=800");
    }

    // Обработчик загрузки iframe
    function handleWebViewLoad() {
        // Ищем первое поле ввода в iframe
        const iframeDoc = webView.contentDocument || webView.contentWindow.document;
        const inputs = iframeDoc.querySelectorAll('input');
        if (inputs.length > 0) {
            currentInput = inputs[0];
            // Убираем autofocus для избежания ошибки
            currentInput.removeAttribute('autofocus');
            currentInput.focus();
        }
        fabScan.style.display = "flex";
    }

    // Обработка данных от сканера
    window.addEventListener("message", (event) => {
        if (event.data?.type === "SCAN_RESULT") {
            const data = event.data.data;
            if (currentInput) {
                currentInput.value = data;
                currentInput.dispatchEvent(new Event("input", { bubbles: true }));
                currentInput.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
                currentInput = null;
            }
        }
    });
</script>
</body>
</html>

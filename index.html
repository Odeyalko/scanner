<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR & Barcode Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: #f5f5f5;
        }

        .container {
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        #inputContainer, #scannerContainer {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #inputContainer {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        #editUrl {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f8f8;
        }

        #btnLoadUrl {
            padding: 12px 24px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
        }

        #btnLoadUrl:hover {
            background: #1976D2;
        }

        #webView {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
        }

        #fabScan {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #2196F3;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1001;
            animation: bounce 1s infinite;
            cursor: pointer;
        }

        #scannerContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scanArea {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 250px;
            border: 4px dashed #FFEB3B;
            border-radius: 16px;
            z-index: 1000;
            pointer-events: none;
        }

        #footer {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 600px) {
            #fabScan {
                width: 64px;
                height: 64px;
                bottom: 16px;
                right: 16px;
            }

            #scanArea {
                width: 300px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="inputContainer">
        <input type="text" id="editUrl" placeholder="Введите URL сайта">
        <button id="btnLoadUrl">Перейти на сайт</button>
    </div>

    <iframe id="webView" style="border: none;"></iframe>

    <button id="fabScan">📸</button>

    <!-- Сканер -->
    <div id="scannerContainer">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display: none;"></canvas>
        <div id="scanArea"></div>
        <div id="footer">by Odeyalko</div>
    </div>

<script>
    // Элементы DOM
    const editUrl = document.getElementById("editUrl");
    const webView = document.getElementById("webView");
    const fabScan = document.getElementById("fabScan");
    const inputContainer = document.getElementById("inputContainer");
    const scannerContainer = document.getElementById("scannerContainer");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const scanArea = document.getElementById("scanArea");

    let scanning = false;
    let currentInput = null;

    // Загрузка сайта
    function loadUrl() {
        const url = editUrl.value.trim();
        if (url) {
            webView.src = url;
            webView.style.display = "block";
            inputContainer.style.display = "none";
            fabScan.style.display = "flex";
        }
    }

    document.getElementById("btnLoadUrl").addEventListener("click", loadUrl);

    // Запуск сканера
    fabScan.addEventListener("click", () => {
        scannerContainer.style.display = "flex";
        inputContainer.style.display = "none";
        webView.style.display = "none";
        fabScan.style.display = "none";
        startScanner();
    });

    // Обработка загрузки iframe
    webView.addEventListener("load", () => {
        try {
            const iframeDoc = webView.contentDocument || webView.contentWindow.document;
            const inputs = iframeDoc.querySelectorAll('input');
            if (inputs.length > 0) {
                currentInput = inputs[0];
                currentInput.removeAttribute('autofocus');
                currentInput.focus();
            }
        } catch (e) {
            console.warn("Невозможно получить доступ к iframe — cross-origin ограничение");
        }
    });

    // Сканер (используем jsQR)
    function startScanner() {
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        let scanning = true;

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
        })
        .then(stream => {
            video.srcObject = stream;
            video.play();

            video.addEventListener("loadeddata", () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                requestAnimationFrame(scanLoop);
            });

            function scanLoop() {
                if (!scanning) return;

                if (video.readyState >= video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        if (currentInput) {
                            currentInput.value = code.data;
                            currentInput.dispatchEvent(new Event("input", { bubbles: true }));
                            currentInput.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
                        } else {
                            window.location.hash = code.data;
                        }

                        stopScanner();
                        inputContainer.style.display = "flex";
                        webView.style.display = "block";
                        scannerContainer.style.display = "none";
                    }
                }

                requestAnimationFrame(scanLoop);
            }
        })
        .catch(err => {
            alert("Ошибка камеры. Проверьте разрешения.");
            console.error("Ошибка доступа к камере:", err);
            stopScanner();
        });

        function stopScanner() {
            scanning = false;
            const stream = video.srcObject;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            scannerContainer.style.display = "none";
            fabScan.style.display = "flex";
        }
    }
</script>

<!-- Подключаем jsQR для сканирования -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</body>
</html>

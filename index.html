<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сканер и Перейти на сайт</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 2em; }
    input { padding: 10px; font-size: 18px; width: 90%; max-width: 400px; border-radius: 8px; border: none; margin-bottom: 1em; }
    button { font-size: 20px; padding: 10px 20px; border-radius: 8px; border: none; background: #333; color: #fff; cursor: pointer; margin: 5px; }
    #videoOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    #videoOverlay video { width: 90%; max-width: 500px; border-radius: 10px; }
    #closeBtn { position: absolute; top: 10px; right: 10px; font-size: 30px; background: none; border: none; color: white; cursor: pointer; }
  </style>
</head>
<body>

  <h2>🌐 Введите URL сайта</h2>
  <input id="urlInput" placeholder="https://example.com">
  <br>
  <button id="goBtn">🚀 Перейти</button>
  <button id="scanBtn">📷 Сканировать</button>

  <script>
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const scanBtn = document.getElementById('scanBtn');

    function openUrl() {
      const url = urlInput.value.trim();
      if (!/^https?:\/\//i.test(url)) {
        alert('Введите корректный URL, начиная с http:// или https://');
        return;
      }
      window.open(url, '_blank'); // открывает сайт в новой вкладке
    }

    goBtn.addEventListener('click', openUrl);
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') openUrl();
    });

    scanBtn.addEventListener('click', () => {
      scanBtn.disabled = true;

      const overlay = document.createElement('div');
      overlay.id = 'videoOverlay';

      const video = document.createElement('video');
      video.setAttribute('autoplay', '');
      video.setAttribute('playsinline', '');
      overlay.appendChild(video);

      const closeBtn = document.createElement('button');
      closeBtn.id = 'closeBtn';
      closeBtn.textContent = '❌';
      overlay.appendChild(closeBtn);

      document.body.appendChild(overlay);

      const codeReader = new ZXing.BrowserMultiFormatReader();

      codeReader.decodeFromVideoDevice(null, video, (result, err) => {
        if (result) {
          const text = result.getText();
          codeReader.reset();
          overlay.remove();
          scanBtn.disabled = false;
          navigator.clipboard.writeText(text).catch(console.error);
        }
      }).catch(err => {
        console.error(err);
        alert('Не удалось получить доступ к камере.');
        overlay.remove();
        scanBtn.disabled = false;
      });

      closeBtn.onclick = () => {
        codeReader.reset();
        overlay.remove();
        scanBtn.disabled = false;
      };
    });
  </script>

</body>
</html>
